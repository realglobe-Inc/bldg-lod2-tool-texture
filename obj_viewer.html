4. obj_viewer.html の debug/bldg-0c6ef283-175d-40b6-8cd5-360f49fa72ec/bldg-0c6ef283-175d-40b6-8cd5-360f49fa72ec.obj を変更してみたいオブジェクトのファイルを選択
  - http.server 実行時点基準の相対パス。
-->

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js OBJ Loader Example</title>
    <style>
        body { margin: 0; }
        canvas { display: block; }
    </style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.137.5/build/three.module.js",
    "OBJLoader": "https://cdn.jsdelivr.net/npm/three@0.137.5/examples/jsm/loaders/OBJLoader.js",
    "OrbitControls": "https://cdn.jsdelivr.net/npm/three@0.137.5/examples/jsm/controls/OrbitControls.js"
  }
}
</script>
<script type="module">
  import * as THREE from 'three';
  import { OBJLoader } from 'OBJLoader';
  import { OrbitControls } from 'OrbitControls';

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x333333);

  const ambientLight = new THREE.AmbientLight(0xcccccc, 0.4);
  scene.add(ambientLight);
  const directionalLight = new THREE.DirectionalLight(0xffffff, 0.3);
  directionalLight.position.set(1, 1, 1);
  scene.add(directionalLight);

  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.z = 500;

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // OrbitControls の設定
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; // 慣性を有効化
  controls.dampingFactor = 0.05;
  controls.screenSpacePanning = false; // 水平方向のパンを無効化
  controls.minDistance = 10; // ズームの最小距離
  controls.maxDistance = 200; // ズームの最大距離

  const objLoader = new OBJLoader();
  objLoader.load(
    'debug/bldg-0c6ef283-175d-40b6-8cd5-360f49fa72ec/bldg-0c6ef283-175d-40b6-8cd5-360f49fa72ec.obj',
    (object) => {
      scene.add(object);

      // オブジェクト内のすべてのメッシュに対して両面描画を有効化
      object.traverse((child) => {
        if (child.isMesh) {
            child.material.side = THREE.DoubleSide; // 両面描画を有効化

            // エッジを描画
            const edges = new THREE.EdgesGeometry(child.geometry);
            const line = new THREE.LineSegments(
                edges,
                new THREE.LineBasicMaterial({ color: 0x000000 })
            );

            // 線を太くする方法（代替としてエッジをメッシュ化）
            const thickEdgesMaterial = new THREE.MeshBasicMaterial({ color: 0x000000 });
            const thickEdgesMesh = new THREE.Mesh(edges, thickEdgesMaterial);
            thickEdgesMesh.scale.set(100, 100, 100); // 若干スケールを大きくしてエッジを目立たせる

            scene.add(thickEdgesMesh);
        }
      });

      // バウンディングボックスを計算
      const boundingBox = new THREE.Box3().setFromObject(object);

      // バウンディングボックスの中心を取得
      const center = boundingBox.getCenter(new THREE.Vector3());

      // オブジェクトの位置を中心が原点に来るように調整
      object.position.sub(center);

      // カメラの位置調整
      const radius = boundingBox.getBoundingSphere(new THREE.Sphere()).radius;
      const distance = radius * 2; // カメラがモデル全体を見渡せる距離
      camera.position.set(0, radius, distance);
      camera.lookAt(0, 0, 0); // 原点を見るように設定

      camera.near = radius / 200;
      camera.far = radius * 200;
      camera.updateProjectionMatrix();

      // コンソールに位置情報を出力
      console.log('Object Center (Before Adjustment):', center);
      console.log('Adjusted Object Position:', object.position);
      console.log('Camera Position:', camera.position);
    },
    undefined,
    (error) => {
      console.error('モデルの読み込み中にエラーが発生しました:', error);
    }
  );



  function animate() {
    requestAnimationFrame(animate);

    // 光源の位置をカメラの位置に同期
    directionalLight.position.copy(camera.position);

    controls.update(); // OrbitControls を更新
    renderer.render(scene, camera);
  }
  animate();


  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
