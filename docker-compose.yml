version : '3.8'
services:
  3d-model:
    image: bldg-lod2-tool-3d-model
    build:
      context: .
    tty: true
    stdin_open: true
    command: >
      env
      BASE_INPUT_DIR="${BASE_INPUT_DIR}"
      BASE_OUTPUT_DIR="${BASE_OUTPUT_DIR}"
      OUTPUT_TEXTURE_ENABLED="${OUTPUT_TEXTURE_ENABLED}"
      LAS_COORDINATE_SYSTEM="${LAS_COORDINATE_SYSTEM}"
      /app/process.sh
    volumes:
      - ${WORKSPACE_DIR:-./workspace}:/workspace
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
