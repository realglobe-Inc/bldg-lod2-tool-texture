version : '3.8'
services:
  3d-model:
    image: bldg-lod2-tool-3d-model
    build:
      context: .
    tty: true
    stdin_open: true
    command: /bin/bash -c "sleep 1000000"
    volumes:
      - ${WORKSPACE_DIR:-~/AutoCreateLod2_tutorial/LOD2Creator_tutorial/dataset}:/workspace
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
