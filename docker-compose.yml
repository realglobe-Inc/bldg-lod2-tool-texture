version: '3.8'
services:
  bldg-lod2-tool-texture:
    image: bldg-lod2-tool-texture
    build:
      context: .
    command: ./process.sh
    volumes:
      - ${DATA_DIR:-./data}:/app/data
    environment:
      MODE: ${MODE:-FULL}
      INPUT_OBJ_DIR: ${INPUT_OBJ_DIR:-/app/data/input/obj}
      INPUT_IMAGE_DIR: ${INPUT_IMAGE_DIR:-/app/data/input/image}
      INPUT_EX_CALIB: ${INPUT_EX_CALIB:-/app/data/input/ex_calib.txt}
      INPUT_CAMERA_INFO: ${INPUT_CAMERA_INFO:-/app/data/input/camera_info.txt}
      INPUT_ORTHO_DIR: ${INPUT_ORTHO_DIR:-}
      OUTPUT_DIR: ${OUTPUT_DIR:-/app/data/output}
      METER_PER_PIXEL: ${METER_PER_PIXEL:-0.16}
      METER_PER_TEXTURE_PIXEL: ${METER_PER_TEXTURE_PIXEL:-0.16}
      GRID_PIXEL: ${GRID_PIXEL:-1000}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
