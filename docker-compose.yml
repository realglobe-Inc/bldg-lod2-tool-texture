version : '3.8'
services:
  3d-model:
    image: bldg-lod2-tool-3d-model
    build:
      context: .
    tty: true
    stdin_open: true
    command: >
      env
      INPUT_DIR='${INPUT_DIR}'
      OUTPUT_DIR='${OUTPUT_DIR}'
      BLDG_LOD2_TOOL_PARAM='${BLDG_LOD2_TOOL_PARAM}'
      OUTPUT_TEXTURE_ENABLED='${OUTPUT_TEXTURE_ENABLED}'
      LAS_COORDINATE_SYSTEM='${LAS_COORDINATE_SYSTEM}'
      METER_PER_TEXTURE_PIXEL='${METER_PER_TEXTURE_PIXEL}'
      /app/process.sh
    volumes:
      - ${WORKSPACE_DIR:-./workspace}:/workspace
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
